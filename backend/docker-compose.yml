# 基础设施编排：仅编排依赖服务，应用本体本地运行
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: offermind
      POSTGRES_PASSWORD: offermind
      POSTGRES_DB: offermind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: offermind
      MINIO_ROOT_PASSWORD: offermind-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
  qdrant_data:
  minio_data:
